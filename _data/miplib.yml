# MIPLIB 实例纪录单一数据源（中英文页面共用，勿在手写表格中维护）。
# 数值保留求解器报告的完整精度；"N/A" = 此前无公开纪录。
# 实例页固定为 https://miplib.zib.de/instance_details_<instance>.html
# 注意：以下为各求解器发表/提交时点的成绩，MIPLIB 现行最优解可能已被其他团队进一步推进。
solvers:
  - id: local-mip
    name: Local-MIP
    desc_zh: "首个面向通用混合整数规划（MIP）模型的局部搜索求解器"
    desc_en: "The first local search solver for general mixed integer programming (MIP)"
  - id: partimip
    name: PartiMIP
    desc_zh: "基于任务分解的大规模分布式混合整数规划（MIP）求解器"
    desc_en: "Parallel MIP solver with dynamic task decomposition"
  - id: bigmip
    name: BigMIP
    desc_zh: "大规模分布式混合整数规划求解器"
    desc_en: "Large-scale distributed MIP solver"
  - id: parailp
    name: ParaILP
    desc_zh: "基于局部搜索的并行整数规划（ILP）求解器，深度结合局部搜索与进化算法"
    desc_en: "Parallel local search ILP solver with cooperative evolution"

